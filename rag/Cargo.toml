# EP-RAG — maximal-Rust pipeline (cargo workspace).
# Crates are added per brick; deps are pinned centrally here (research 2026-07-10).
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# HTTP service (rag-server) + streaming client to llama-server.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
tokio-stream = "0.1"
qdrant-client = "1"
uuid = { version = "1", features = ["v5"] }
